    <linearGradient id="bgApple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12132A"/>
      <stop offset="100%" stop-color="#08080F"/>
    </linearGradient>
    <linearGradient id="pinApple" x1="0%" y1="0%" x2="100%" y2="110%">
      <stop offset="0%" stop-color="#6BA5FF"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <!-- Apple touch icon — uses standard rounded rect background -->
  <rect width="180" height="180" rx="40" ry="40" fill="url(#bgApple)"/>
  <ellipse cx="90" cy="85" rx="42" ry="38" fill="rgba(79,142,247,0.15)"/>
