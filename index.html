<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />

  <!-- PWA Core -->
  <meta name="application-name" content="Hugo" />
  <meta name="theme-color" content="#0A0B12" id="metaTheme" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="Navigation that knows better. Hugo is the smarter way to get anywhere." />

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hugo" />

  <!-- Icons -->
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.svg" />
  <link rel="manifest" href="manifest.json" />

  <!-- Leaflet Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <title>Hugo — Navigation</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════
       SPLASH SCREEN
  ═══════════════════════════════════════════ -->
  <div id="splash" aria-hidden="true">
    <div class="splash-bg"></div>
    <div class="splash-particles" id="splashParticles"></div>
    <div class="splash-content">
      <!-- Animated SVG Logo -->
      <div class="splash-logo-wrap">
        <svg class="splash-logo" viewBox="0 0 120 140" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <!-- Pin glow -->
          <ellipse class="pin-glow" cx="60" cy="72" rx="44" ry="44" fill="rgba(79,142,247,0.12)" />
          <!-- Pin outline (animated draw) -->
          <path class="pin-outline"
            d="M60 10 C33 10, 12 31, 12 58 C12 86, 42 112, 60 132 C78 112, 108 86, 108 58 C108 31, 87 10, 60 10 Z"
            fill="none" stroke="url(#pinGrad)" stroke-width="3.5" stroke-linecap="round" />
          <!-- Pin fill -->
          <path class="pin-fill"
            d="M60 14 C35 14, 16 33, 16 58 C16 84, 44 109, 60 128 C76 109, 104 84, 104 58 C104 33, 85 14, 60 14 Z"
            fill="rgba(79,142,247,0.1)" />
          <!-- H letterform (animated draw) -->
          <path class="letter-h"
            d="M38 40 L38 76 M38 58 L82 58 M82 40 L82 76"
            fill="none" stroke="white" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
          <!-- Gradient defs -->
          <defs>
            <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#4F8EF7" />
              <stop offset="100%" stop-color="#A78BFA" />
            </linearGradient>
          </defs>
        </svg>
        <div class="splash-pulse-ring"></div>
        <div class="splash-pulse-ring" style="animation-delay:0.4s"></div>
      </div>

      <!-- Brand text -->
      <div class="splash-wordmark">
        <span class="splash-letter" style="--i:0">H</span>
        <span class="splash-letter" style="--i:1">U</span>
        <span class="splash-letter" style="--i:2">G</span>
        <span class="splash-letter" style="--i:3">O</span>
      </div>
      <p class="splash-tagline">Navigation that knows better</p>

      <!-- Progress bar -->
      <div class="splash-progress-track">
        <div class="splash-progress-bar"></div>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       MAIN APP
  ═══════════════════════════════════════════ -->
  <div id="app" class="app-hidden" role="main">

    <!-- Map Container -->
    <div id="map" role="region" aria-label="Navigation map"></div>

    <!-- ─────── TOP BAR ─────── -->
    <header class="top-bar" id="topBar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <line x1="3" y1="7" x2="21" y2="7"/>
          <line x1="3" y1="12" x2="17" y2="12"/>
          <line x1="3" y1="17" x2="21" y2="17"/>
        </svg>
      </button>

      <button class="search-trigger ripple-btn" id="searchTrigger" aria-label="Search destination">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="11" cy="11" r="7"/>
          <path d="m21 21-4.35-4.35"/>
        </svg>
        <span class="search-placeholder">Where to?</span>
        <kbd class="search-shortcut">⌘K</kbd>
      </button>

      <button class="icon-btn theme-btn" id="themeToggle" aria-label="Toggle theme">
        <span class="toggle-icon">☀️</span>
      </button>
    </header>

    <!-- ─────── SEARCH PANEL ─────── -->
    <div class="search-panel" id="searchPanel" role="dialog" aria-modal="true" aria-label="Search">
      <div class="search-panel-header">
        <button class="icon-btn back-btn" id="searchBack" aria-label="Close search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M19 12H5M12 5l-7 7 7 7"/>
          </svg>
        </button>
        <div class="search-field-wrap">
          <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <circle cx="11" cy="11" r="7"/>
            <path d="m21 21-4.35-4.35"/>
          </svg>
          <input type="search"
                 class="search-field"
                 id="searchInput"
                 placeholder="Search a destination…"
                 autocomplete="off"
                 autocorrect="off"
                 spellcheck="false"
                 enterkeyhint="search"
                 aria-label="Search destination" />
          <button class="clear-btn" id="clearSearch" aria-label="Clear search" style="display:none">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
          <div class="search-spinner" id="searchSpinner"></div>
        </div>
      </div>
      <div class="search-results" id="searchResults" role="listbox">
        <!-- Populated by JS -->
      </div>
    </div>

    <!-- ─────── FLOATING ACTION BUTTONS ─────── -->
    <div class="fab-stack" id="fabStack">
      <button class="fab ripple-btn" id="locationBtn" aria-label="My location" title="My location">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 1v3M12 20v3M1 12h3M20 12h3"/>
          <circle cx="12" cy="12" r="9" stroke-dasharray="2 4"/>
        </svg>
      </button>
      <button class="fab fab-sm ripple-btn" id="layersBtn" aria-label="Map layers" title="Map layers" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <polygon points="12 2 22 8.5 12 15 2 8.5 12 2"/>
          <polyline points="22 15.5 12 22 2 15.5"/>
          <polyline points="22 12 12 18.5 2 12"/>
        </svg>
      </button>
    </div>

    <!-- ─────── ROUTE / DIRECTIONS BOTTOM SHEET ─────── -->
    <div class="bottom-sheet" id="routeCard" role="dialog" aria-label="Route information">
      <div class="sheet-handle-bar">
        <div class="sheet-handle"></div>
      </div>

      <div class="route-header">
        <div class="route-dest-wrap">
          <div class="route-dest-pin">
            <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
              <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
            </svg>
          </div>
          <div>
            <div class="route-dest-name" id="routeDest">Destination</div>
            <div class="route-meta">
              <span class="route-time-badge" id="routeTime">—</span>
              <span class="route-dot">·</span>
              <span class="route-dist-badge" id="routeDist">—</span>
            </div>
          </div>
        </div>
        <div class="route-actions">
          <button class="start-btn ripple-btn" id="startNavBtn" disabled>
            <svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16">
              <path d="M8 5v14l11-7z"/>
            </svg>
            Start
          </button>
          <button class="close-sheet-btn ripple-btn" id="closeRouteBtn" aria-label="Close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="route-error hidden" id="routeError">
        <span>⚠️ Could not find a route. Try a different destination.</span>
      </div>

      <div class="directions-list" id="directionsList">
        <!-- Populated by JS -->
      </div>
    </div>

    <!-- ─────── NAVIGATION HUD ─────── -->
    <div class="nav-hud" id="navHud" role="status" aria-live="polite">
      <div class="hud-turn">
        <div class="hud-turn-icon" id="navTurnIcon" aria-hidden="true">↑</div>
        <div class="hud-turn-info">
          <div class="hud-turn-dist" id="navTurnDist">Calculating…</div>
          <div class="hud-turn-street" id="navTurnStreet">Please wait</div>
        </div>
      </div>
      <button class="end-nav-btn ripple-btn" id="stopNavBtn" aria-label="End navigation">
        End
      </button>
    </div>

    <!-- Speed display during navigation -->
    <div class="speed-display" id="speedDisplay">
      <div class="speed-num" id="speedNum">0</div>
      <div class="speed-unit">km/h</div>
    </div>

    <!-- ─────── SIDE PANELS ─────── -->
    <div class="side-panel" id="explorePanel" role="region" aria-label="Explore nearby" hidden>
      <!-- Populated by JS -->
    </div>
    <div class="side-panel" id="routesPanel" role="region" aria-label="Saved routes" hidden>
      <!-- Populated by JS -->
    </div>
    <div class="side-panel" id="profilePanel" role="region" aria-label="Profile and settings" hidden>
      <div class="panel-header">
        <h2>Settings</h2>
      </div>
      <div class="settings-list">
        <div class="settings-group">
          <div class="settings-label">Appearance</div>
          <button class="settings-row ripple-btn" id="themeToggleMenu">
            <div class="settings-row-left">
              <span class="settings-row-icon">🎨</span>
              <span>Theme</span>
            </div>
            <span class="settings-value" id="themeValue">Dark</span>
          </button>
          <button class="settings-row ripple-btn" id="unitsToggle">
            <div class="settings-row-left">
              <span class="settings-row-icon">📏</span>
              <span>Distance Units</span>
            </div>
            <span class="settings-value" id="unitsValue">km</span>
          </button>
        </div>
        <div class="settings-group">
          <div class="settings-label">About</div>
          <div class="settings-row no-hover">
            <div class="settings-row-left">
              <span class="settings-row-icon">🗺️</span>
              <span>Hugo Navigation</span>
            </div>
            <span class="settings-value">v1.0</span>
          </div>
          <div class="settings-row no-hover">
            <div class="settings-row-left">
              <span class="settings-row-icon">📡</span>
              <span>Map data</span>
            </div>
            <span class="settings-value">OpenStreetMap</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ─────── BOTTOM NAVIGATION ─────── -->
    <nav class="bottom-nav" id="bottomNav" aria-label="Main navigation">
      <button class="nav-tab active" data-tab="map" aria-label="Map" aria-current="page">
        <div class="nav-tab-bg"></div>
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"/>
          <line x1="9" y1="3" x2="9" y2="18"/>
          <line x1="15" y1="6" x2="15" y2="21"/>
        </svg>
        <span class="nav-label">Map</span>
      </button>
      <button class="nav-tab" data-tab="explore" aria-label="Explore">
        <div class="nav-tab-bg"></div>
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="10"/>
          <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
        </svg>
        <span class="nav-label">Explore</span>
      </button>
      <button class="nav-tab" data-tab="routes" aria-label="Routes">
        <div class="nav-tab-bg"></div>
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M3 12h4l3-9 4 18 3-9h4"/>
        </svg>
        <span class="nav-label">Routes</span>
      </button>
      <button class="nav-tab" data-tab="profile" aria-label="Profile">
        <div class="nav-tab-bg"></div>
        <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span class="nav-label">Profile</span>
      </button>
    </nav>

  </div><!-- #app -->

  <!-- Toast notification -->
  <div id="toastContainer" aria-live="assertive" aria-atomic="true"></div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
